<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="単語帳">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>わたしの単語帳</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1d1f24; --sub:#6b6f78; --line:#e4e1d8;
    --accent:#2f6fde; --accent-ink:#ffffff; --hit:#fff3c4; --danger:#c8402f;
    --ok:#1f8a4c; --ok-bg:#e1f3e8; --mid:#b07400; --mid-bg:#fbf0d6; --ng:#c8402f; --ng-bg:#fbe5e1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181d; --card:#1f2229; --ink:#e9eaee; --sub:#9aa0ab; --line:#2e323b;
      --accent:#6a9cff; --accent-ink:#0f1115; --hit:#4a3f12; --danger:#ff7a68;
      --ok:#5fd08f; --ok-bg:#183223; --mid:#f0bf55; --mid-bg:#352a12; --ng:#ff7a68; --ng-bg:#3a1d19;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    line-height:1.5;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 80px;}
  header{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 14px;}
  h1{font-size:1.25rem;font-weight:700;letter-spacing:.04em;}
  #count{font-size:.8rem;color:var(--sub);}

  /* ---- 入力カード ---- */
  .add{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .add .row{display:flex;gap:8px;}
  .add input{flex:1;min-width:0;}
  input,textarea{
    font:inherit;font-size:16px;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;
  }
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;}
  #fWord{font-weight:600;margin-bottom:8px;}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;}
  .primary{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 18px;white-space:nowrap;}
  .primary:disabled{opacity:.4;cursor:default;}
  .ghost{background:transparent;color:var(--sub);border:1px solid var(--line);padding:8px 12px;font-size:.85rem;}
  .ghost:hover{color:var(--ink);}
  .ghost.on{color:var(--accent);border-color:var(--accent);}
  #exists{font-size:.82rem;margin-top:8px;min-height:0;}
  #exists:empty{display:none;}
  #exists .tag{display:inline-block;font-size:.7rem;font-weight:700;color:var(--accent-ink);background:var(--accent);
    border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px;}
  .hint{font-size:.75rem;color:var(--sub);margin-top:8px;}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:.85rem;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- 検索と表示切替 ---- */
  .tools{display:flex;gap:8px;align-items:center;margin:18px 0 0;flex-wrap:wrap;}
  .tools #q{flex:1 1 200px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg .ghost{white-space:nowrap;}

  /* ---- A–Z ジャンプ ---- */
  #az{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
    padding:10px 0 8px;border-bottom:1px solid var(--line);margin-top:10px;}
  #az::-webkit-scrollbar{display:none;}
  #az[hidden]{display:none;}
  #az a{flex:0 0 auto;min-width:28px;text-align:center;font-size:.8rem;font-weight:700;padding:3px 0;
    color:var(--accent);text-decoration:none;border-radius:6px;}
  #az a.off{color:var(--line);pointer-events:none;}
  #az a:hover{background:var(--card);}

  /* ---- 一覧 ---- */
  .group h2{font-size:.85rem;color:var(--sub);font-weight:700;padding:14px 4px 4px;scroll-margin-top:52px;}
  .item{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:0;padding:10px 12px;margin-top:-1px;}
  .group .item:nth-of-type(1){border-radius:12px 12px 0 0;}
  .group .item:last-child{border-radius:0 0 12px 12px;}
  .group .item:only-of-type{border-radius:12px;}
  .item{align-items:center;padding:4px 6px 4px 0;}
  .item .body{flex:1;min-width:0;display:flex;gap:12px;align-items:baseline;text-align:left;background:transparent;color:inherit;
    border-radius:8px;padding:6px 0 6px 12px;}
  .item .w{flex:0 0 42%;font-weight:600;word-break:break-word;}
  .item .m{flex:1;min-width:0;color:var(--ink);word-break:break-word;}
  /* 〇△× ワンタッチ評価 */
  .marks{display:flex;gap:2px;flex:0 0 auto;}
  .mk{width:32px;height:32px;border-radius:8px;background:transparent;color:var(--sub);opacity:.45;font-size:.95rem;font-weight:700;line-height:1;padding:0;}
  .mk:hover{opacity:.9;}
  .mk.on{opacity:1;}
  .item .body:focus{outline:none;}
  .item .body:focus-visible,.mk:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .mk.on[data-v="o"]{background:var(--ok-bg);color:var(--ok);}
  .mk.on[data-v="d"]{background:var(--mid-bg);color:var(--mid);}
  .mk.on[data-v="x"]{background:var(--ng-bg);color:var(--ng);}
  .group h2 .n{font-weight:400;margin-left:6px;}
  .item .m.hid{color:transparent;background:var(--line);border-radius:6px;user-select:none;}
  .item.flash{animation:flash 1.6s ease-out;}
  @keyframes flash{from{background:var(--hit);}to{background:var(--card);}}
  mark{background:var(--hit);color:inherit;border-radius:3px;}
  #empty{color:var(--sub);text-align:center;padding:40px 0;font-size:.9rem;}
  @media (max-width:420px){ .item .body{flex-direction:column;gap:2px;} .item .w{flex:none;} }

  .menu{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:28px;}

  /* ---- ダイアログ ---- */
  dialog{margin:auto;border:none;border-radius:16px;background:var(--card);color:var(--ink);
    width:min(520px,calc(100% - 32px));padding:18px;}
  dialog::backdrop{background:rgba(0,0,0,.45);}
  dialog h3{font-size:1rem;margin-bottom:12px;}
  dialog label{display:block;font-size:.78rem;color:var(--sub);margin:10px 0 4px;}
  dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
  dialog .acts .del{margin-right:auto;color:var(--danger);border-color:var(--danger);}
  #bulkText{min-height:200px;resize:vertical;font-size:14px;}
  #bulkPrev{font-size:.8rem;color:var(--sub);margin-top:8px;max-height:140px;overflow:auto;}
  #bulkPrev b{color:var(--ink);}

  /* ---- タブ ---- */
  .tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:14px;}
  .tabs button{flex:1;background:transparent;color:var(--sub);font-weight:700;padding:8px 0;border-radius:9px;font-size:.9rem;}
  .tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}

  /* ---- 間違えた問題 ---- */
  .logform{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;}
  .logform .row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;}
  @media (max-width:420px){ .logform .row3{grid-template-columns:1fr 1fr;} .logform .row3 #lBook{grid-column:1 / -1;} }
  .logform .row{display:flex;gap:8px;}
  .logform .row .ghost{white-space:nowrap;}
  .logform label{font-size:.75rem;color:var(--sub);display:block;margin-bottom:3px;}
  #lNote{min-height:70px;resize:vertical;}
  .logform .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  .logform .acts .del{margin-right:auto;color:var(--danger);border-color:var(--danger);}
  .logform.editing{border-color:var(--accent);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chips:empty{display:none;}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;border-radius:16px;padding:4px 10px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);text-decoration:none;}
  .chip.reg{border-color:var(--accent);color:var(--accent);}
  .chip.unreg{border-style:dashed;color:var(--sub);}
  .chip .x{background:transparent;color:var(--sub);padding:0 0 0 2px;font-size:.9rem;line-height:1;}
  .chip small{font-size:.72rem;color:var(--sub);}
  .logtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px;}
  .logtools select{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex:1 1 160px;min-width:0;}
  .logtools .ghost{white-space:nowrap;}
  .book h2{font-size:.85rem;color:var(--sub);font-weight:700;padding:16px 4px 6px;}
  .book h2 .n{font-weight:400;margin-left:6px;}
  .entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;}
  .entry.done{opacity:.6;}
  .entry .top{display:flex;align-items:center;gap:8px;}
  .entry .where{flex:1;min-width:0;text-align:left;background:transparent;color:var(--ink);padding:0;font-weight:700;font-variant-numeric:tabular-nums;}
  .entry .where small{font-weight:400;color:var(--sub);margin-left:6px;}
  .entry .note{white-space:pre-wrap;word-break:break-word;font-size:.92rem;}
  .entry .donebtn{font-size:.78rem;padding:5px 10px;border-radius:16px;white-space:nowrap;}
  .entry .donebtn.on{background:var(--ok-bg);color:var(--ok);border-color:transparent;}
  #logEmpty{color:var(--sub);text-align:center;padding:32px 0;font-size:.9rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>わたしの単語帳</h1>
    <span id="count"></span>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tabBtnWords" aria-selected="true" aria-controls="tabWords">単語帳</button>
    <button type="button" role="tab" id="tabBtnLog" aria-selected="false" aria-controls="tabLog">間違えた問題</button>
  </nav>

  <section id="tabWords" role="tabpanel">
  <form class="add" id="addForm" autocomplete="off">
    <input id="fWord" placeholder="英語(例: Competent)" autocapitalize="off" spellcheck="false" enterkeyhint="next" aria-label="英語">
    <div class="row">
      <input id="fMean" placeholder="意味(例: 有能)" enterkeyhint="done" aria-label="意味">
      <button class="primary" id="addBtn" type="submit" disabled>追加</button>
    </div>
    <div id="exists" aria-live="polite"></div>
    <p class="hint">「Competent…有能」のように1行で入力してもOK。英語欄で Enter を押すと意味欄に移ります。</p>
  </form>

  <div class="tools">
    <input id="q" type="search" placeholder="検索(英語・日本語どちらでも)" aria-label="検索">
    <div class="seg">
      <button class="ghost on" id="sortAbc" type="button">ABC順</button>
      <button class="ghost" id="sortNew" type="button">新しい順</button>
      <button class="ghost" id="sortMark" type="button" title="×→△→未評価→〇の順">覚え具合順</button>
      <button class="ghost" id="hideBtn" type="button" title="意味をかくして復習">意味をかくす</button>
    </div>
  </div>

  <nav id="az" aria-label="頭文字へジャンプ"></nav>
  <div id="list"></div>
  <p id="empty" hidden></p>
  </section>

  <section id="tabLog" role="tabpanel" hidden>
    <form class="logform" id="logForm" autocomplete="off">
      <div class="row3">
        <div id="lBook"><label for="lBookIn">テキスト・問題集</label><input id="lBookIn" list="bookList" placeholder="例: 公式TOEIC問題集 10"></div>
        <div><label for="lPage">ページ</label><input id="lPage" inputmode="numeric" placeholder="263"></div>
        <div><label for="lNum">問題番号</label><input id="lNum" placeholder="142"></div>
      </div>
      <datalist id="bookList"></datalist>
      <div><label for="lNote">備考・メモ</label><textarea id="lNote" placeholder="例: 主語は the number(単数)なので is leased が正解"></textarea></div>
      <div>
        <label for="lWordIn">関連する単語(Enterで追加)</label>
        <div class="row"><input id="lWordIn" placeholder="例: lease" autocapitalize="off" spellcheck="false" enterkeyhint="enter"><button class="ghost" id="lWordAdd" type="button">追加</button></div>
      </div>
      <div class="chips" id="lChips"></div>
      <p class="hint" style="margin:0">青い単語は単語帳に登録済みでタップすると飛べます。点線の単語はタップすると単語帳に登録できます。</p>
      <div class="acts">
        <button class="ghost del" id="lDel" type="button" hidden>削除</button>
        <button class="ghost" id="lCancel" type="button" hidden>キャンセル</button>
        <button class="primary" id="lSave" type="submit">記録する</button>
      </div>
    </form>

    <div class="logtools">
      <select id="lFilter" aria-label="テキストで絞り込み"></select>
      <button class="ghost" id="lTodo" type="button">未復習だけ</button>
    </div>
    <input id="lq" type="search" placeholder="メモや単語で検索" aria-label="間違えた問題を検索" style="margin-top:8px">
    <div id="logList"></div>
    <p id="logEmpty" hidden></p>
  </section>

  <div class="menu">
    <button class="ghost" id="bulkOpen" type="button">まとめて貼り付け</button>
    <button class="ghost" id="exportBtn" type="button">バックアップを保存</button>
    <button class="ghost" id="importBtn" type="button">バックアップを読み込み</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h3>編集</h3>
    <label for="eWord">英語</label>
    <input id="eWord" autocapitalize="off" spellcheck="false">
    <label for="eMean">意味</label>
    <textarea id="eMean" rows="3"></textarea>
    <div class="acts">
      <button class="ghost del" id="delBtn" type="button">削除</button>
      <button class="ghost" value="cancel" formnovalidate>キャンセル</button>
      <button class="primary" id="saveBtn" value="save">保存</button>
    </div>
  </form>
</dialog>

<dialog id="bulkDlg">
  <form method="dialog">
    <h3>まとめて貼り付け</h3>
    <p class="hint" style="margin-top:0">1行に1語。「英語…意味」「英語:意味」「英語→意味」「英語(タブ)意味」の形式を読み取ります。登録済みの単語は意味が追記されます。</p>
    <textarea id="bulkText" placeholder="Competent…有能&#10;Exclusively…限定≒only"></textarea>
    <div id="bulkPrev"></div>
    <div class="acts">
      <button class="ghost" value="cancel">キャンセル</button>
      <button class="primary" id="bulkAdd" value="add" disabled>追加</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>

<script>
/* ================= 保存 ================= */
const KEY='vocab-book-v1';
let words=[];
let storageOK=true;

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw===null){ words=seed(); save(); return; }
    words=JSON.parse(raw)||[];
  }catch(e){ storageOK=false; words=seed(); }
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(words)); storageOK=true; }
  catch(e){ storageOK=false; toast('この端末に保存できませんでした'); }
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ================= 並び替え・グループ ================= */
const norm=s=>s.trim().toLowerCase();
function sortKey(w){ return w.toLowerCase().replace(/^[^a-z0-9]+/,''); }
function letterOf(w){ const c=sortKey(w).charAt(0); return /[a-z]/.test(c)?c.toUpperCase():'#'; }
const cmp=(a,b)=>sortKey(a.word).localeCompare(sortKey(b.word),'en',{sensitivity:'base',numeric:true});

function findWord(w){ const n=norm(w); return words.find(x=>norm(x.word)===n); }

/* 同じ単語があれば意味を追記、なければ新規。結果の項目を返す */
function upsert(word,meaning){
  word=word.trim(); meaning=meaning.trim();
  const ex=findWord(word);
  if(ex){
    if(meaning && !ex.meaning.split(' / ').includes(meaning)){
      ex.meaning=ex.meaning?ex.meaning+' / '+meaning:meaning;
    }
    return {item:ex,merged:true};
  }
  const item={id:uid(),word,meaning,added:Date.now()};
  words.push(item);
  return {item,merged:false};
}

/* ================= 1行の読み取り ================= */
const SEP=/\s*(?:…|\.{3}|\t|：|:|→|＝|=)\s*/;
function splitLine(line){
  const m=line.match(SEP);
  if(!m) return null;
  return {word:line.slice(0,m.index).trim(), meaning:line.slice(m.index+m[0].length).trim()};
}
function parseBulk(text){
  const out=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim();
    if(!line) continue;
    const p=splitLine(line);
    if(p && p.word){ out.push(p); continue; }
    // 「→…」「(…」のように区切りや括弧で始まる行は、前の単語の意味の続きとして扱う
    if(out.length && (p || /^[「（(〜・※]/.test(line))){
      out[out.length-1].meaning+=' '+line;
    }else{
      out.push({word:line, meaning:''});
    }
  }
  return out;
}

/* ================= 描画 ================= */
const $=id=>document.getElementById(id);
let sortMode='abc', hideMeaning=false, revealed=new Set();

function esc(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hl(text,q){
  if(!q) return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}

function render(){
  const q=$('q').value.trim();
  const ql=q.toLowerCase();
  let shown=q?words.filter(w=>w.word.toLowerCase().includes(ql)||w.meaning.toLowerCase().includes(ql)):words.slice();
  if(!$('tabWords').hidden) $('count').textContent=words.length+'語';

  const list=$('list'); list.innerHTML='';
  const az=$('az');
  $('empty').hidden=shown.length>0;
  $('empty').textContent=words.length?'「'+q+'」に一致する単語はありません':'まだ単語がありません。上の欄から追加しましょう。';

  const groups=new Map();
  if(sortMode==='abc'){
    shown.sort(cmp);
    for(const w of shown){ const L=letterOf(w.word); if(!groups.has(L))groups.set(L,[]); groups.get(L).push(w); }
  }else if(sortMode==='mark'){
    // 覚えられないものから順に: × → △ → 未評価 → 〇(各グループ内はABC順)
    shown.sort(cmp);
    for(const k of ['x','d','','o']){ const g=shown.filter(w=>(w.mark||'')===k); if(g.length) groups.set('m'+k,g); }
  }else{
    shown.sort((a,b)=>b.added-a.added);
    groups.set('',shown);
  }

  az.hidden=sortMode!=='abc';
  az.innerHTML='';
  for(const L of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'){
    const a=document.createElement('a');
    a.textContent=L; a.href='#g-'+L;
    if(!groups.has(L)) a.className='off';
    a.addEventListener('click',e=>{e.preventDefault(); $('g-'+L)?.scrollIntoView({behavior:'smooth'});});
    az.appendChild(a);
  }

  for(const [L,items] of groups){
    const sec=document.createElement('section'); sec.className='group';
    if(L){
      const h=document.createElement('h2');
      if(L.startsWith('m')){ h.innerHTML=esc(MARK_LABEL[L.slice(1)])+'<span class="n">'+items.length+'語</span>'; }
      else { h.id='g-'+L; h.textContent=L; }
      sec.appendChild(h);
    }
    for(const w of items){
      const row=document.createElement('div');
      row.className='item'; row.dataset.id=w.id;
      const hid=hideMeaning && !revealed.has(w.id);
      const b=document.createElement('button');
      b.type='button'; b.className='body';
      b.innerHTML='<span class="w">'+hl(w.word,q)+'</span><span class="m'+(hid?' hid':'')+'">'+(hl(w.meaning,q)||'<span style="color:var(--sub)">(意味なし)</span>')+'</span>';
      b.addEventListener('click',()=>{
        if(hideMeaning && !revealed.has(w.id)){ revealed.add(w.id); render(); return; }
        openEdit(w);
      });
      const marks=document.createElement('div'); marks.className='marks';
      for(const [v,ch,label] of [['o','〇','知ってる'],['d','△','微妙'],['x','×','覚えられない']]){
        const m=document.createElement('button');
        m.type='button'; m.className='mk'+(w.mark===v?' on':''); m.dataset.v=v; m.textContent=ch;
        m.title=label; m.setAttribute('aria-label',w.word+': '+label); m.setAttribute('aria-pressed',w.mark===v);
        m.addEventListener('click',()=>setMark(w,v));
        marks.appendChild(m);
      }
      row.append(b,marks);
      sec.appendChild(row);
    }
    list.appendChild(sec);
  }
}

/* 〇△× をワンタッチで記録(同じ印をもう一度押すと解除) */
const MARK_LABEL={o:'〇 知ってる',d:'△ 微妙',x:'× 覚えられない','':'未評価'};
function setMark(w,v){
  w.mark = w.mark===v ? '' : v;
  save(); render();
}

function flashItem(id){
  requestAnimationFrame(()=>{
    const el=document.querySelector('.item[data-id="'+id+'"]');
    if(!el) return;
    el.scrollIntoView({block:'center',behavior:'smooth'});
    el.classList.add('flash');
  });
}

let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ================= 入力 ================= */
const fWord=$('fWord'), fMean=$('fMean');

function currentInput(){
  // 英語欄に「英語…意味」と1行で書かれた場合は分割する
  let w=fWord.value, m=fMean.value;
  const p=splitLine(w);
  if(p && p.word && !m.trim()){ w=p.word; m=p.meaning; }
  return {word:w.trim(), meaning:m.trim()};
}

function updateExists(){
  const {word}=currentInput();
  $('addBtn').disabled=!word;
  const ex=word && findWord(word);
  $('exists').innerHTML=ex?'<span class="tag">登録済み</span><b>'+esc(ex.word)+'</b> … '+esc(ex.meaning||'(意味なし)'):'';
}
fWord.addEventListener('input',updateExists);
fMean.addEventListener('input',updateExists);
fWord.addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.isComposing){
    e.preventDefault();
    const {word,meaning}=currentInput();
    if(word && meaning && splitLine(fWord.value)) $('addForm').requestSubmit();
    else fMean.focus();
  }
});

$('addForm').addEventListener('submit',e=>{
  e.preventDefault();
  const {word,meaning}=currentInput();
  if(!word) return;
  const {item,merged}=upsert(word,meaning);
  save();
  fWord.value=''; fMean.value=''; updateExists();
  if($('q').value){ $('q').value=''; }
  render(); flashItem(item.id);
  toast(merged?'「'+item.word+'」は登録済みなので意味を追記しました':'「'+item.word+'」を追加しました');
  fWord.focus();
});

/* ================= 検索・表示切替 ================= */
$('q').addEventListener('input',render);
const SORT_BTNS={abc:'sortAbc',new:'sortNew',mark:'sortMark'};
for(const [mode,id] of Object.entries(SORT_BTNS)){
  $(id).addEventListener('click',()=>{
    sortMode=mode;
    for(const other of Object.values(SORT_BTNS)) $(other).classList.toggle('on',other===id);
    render();
  });
}
$('hideBtn').addEventListener('click',()=>{
  hideMeaning=!hideMeaning; revealed.clear();
  $('hideBtn').classList.toggle('on',hideMeaning);
  $('hideBtn').textContent=hideMeaning?'意味を表示':'意味をかくす';
  render();
});

/* ================= 編集 ================= */
let editing=null;
function openEdit(w){
  editing=w;
  $('eWord').value=w.word; $('eMean').value=w.meaning;
  $('editDlg').showModal();
}
$('editDlg').addEventListener('close',()=>{
  if($('editDlg').returnValue==='save' && editing){
    const nw=$('eWord').value.trim(), nm=$('eMean').value.trim();
    if(nw){
      const dup=findWord(nw);
      if(dup && dup!==editing){
        // 別の登録済み単語と同じ綴りになった場合はまとめる
        upsert(nw,nm); words=words.filter(x=>x!==editing);
        toast('「'+dup.word+'」にまとめました');
      }else{ editing.word=nw; editing.meaning=nm; }
      save(); render();
    }
  }
  editing=null; $('editDlg').returnValue='';
});
$('delBtn').addEventListener('click',()=>{
  if(!editing) return;
  if(!confirm('「'+editing.word+'」を削除しますか?')) return;
  words=words.filter(x=>x!==editing);
  save(); editing=null; $('editDlg').close(); render(); toast('削除しました');
});

/* ================= まとめて貼り付け ================= */
$('bulkOpen').addEventListener('click',()=>{ $('bulkText').value=''; bulkPreview(); $('bulkDlg').showModal(); });
function bulkPreview(){
  const items=parseBulk($('bulkText').value);
  $('bulkAdd').disabled=!items.length;
  if(!items.length){ $('bulkPrev').innerHTML=''; return; }
  const dup=items.filter(i=>findWord(i.word)).length;
  $('bulkPrev').innerHTML='<b>'+items.length+'語</b>を読み取りました'+(dup?'(うち登録済み '+dup+'語)':'')+'<br>'+
    items.slice(0,30).map(i=>esc(i.word)+' … '+esc(i.meaning||'(意味なし)')).join('<br>')+(items.length>30?'<br>…':'');
}
$('bulkText').addEventListener('input',bulkPreview);
$('bulkDlg').addEventListener('close',()=>{
  if($('bulkDlg').returnValue!=='add') return;
  const items=parseBulk($('bulkText').value);
  for(const i of items) upsert(i.word,i.meaning);
  save(); render(); toast(items.length+'語を取り込みました');
  $('bulkDlg').returnValue='';
});

/* ================= バックアップ ================= */
$('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({app:'vocab-book',version:2,words,mistakes},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const d=new Date();
  a.href=URL.createObjectURL(blob);
  a.download='単語帳-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    const list=Array.isArray(data)?data:data.words;
    if(!Array.isArray(list)) throw 0;
    let n=0;
    for(const i of list){
      if(i && typeof i.word==='string' && i.word.trim()){
        const {item}=upsert(i.word,String(i.meaning||''));
        if(['o','d','x'].includes(i.mark)) item.mark=i.mark;
        n++;
      }
    }
    // 間違えた問題の記録(同じ記録は重ねない)
    let m=0;
    if(Array.isArray(data.mistakes)){
      for(const r of data.mistakes){
        if(!r||typeof r!=='object') continue;
        if(r.id && mistakes.some(x=>x.id===r.id)) continue;
        mistakes.push({id:r.id||uid(),book:String(r.book||''),page:String(r.page||''),num:String(r.num||''),
          note:String(r.note||''),words:Array.isArray(r.words)?r.words.map(String):[],done:!!r.done,added:Number(r.added)||Date.now()});
        m++;
      }
      saveLog();
    }
    save(); render(); renderLog();
    toast(n+'語'+(m?'・問題'+m+'件':'')+'を読み込みました(重複はまとめました)');
  }catch(err){ toast('バックアップファイルを読み込めませんでした'); }
});

/* ================= タブ ================= */
const TAB_KEY='vocab-tab';
function showTab(name){
  const log=name==='log';
  $('tabWords').hidden=log; $('tabLog').hidden=!log;
  $('tabBtnWords').setAttribute('aria-selected',!log);
  $('tabBtnLog').setAttribute('aria-selected',log);
  $('count').textContent=log?mistakes.length+'件':words.length+'語';
  try{ localStorage.setItem(TAB_KEY,name); }catch(e){}
  if(log) renderLog();
}
$('tabBtnWords').addEventListener('click',()=>showTab('words'));
$('tabBtnLog').addEventListener('click',()=>showTab('log'));

/* ================= 間違えた問題 ================= */
const LOG_KEY='vocab-mistakes-v1';
let mistakes=[];      // {id, book, page, num, note, words:[], done, added}
function loadLog(){
  try{ mistakes=JSON.parse(localStorage.getItem(LOG_KEY)||'[]')||[]; }catch(e){ mistakes=[]; }
}
function saveLog(){
  try{ localStorage.setItem(LOG_KEY,JSON.stringify(mistakes)); }
  catch(e){ toast('この端末に保存できませんでした'); }
}

/* 単語帳から探す: 完全一致 → 記号(〇など)を除いて一致 → 「lease」で「lease out」のような前方一致 */
const looseKey=s=>String(s).toLowerCase().replace(/[^a-z0-9' -]/g,' ').replace(/\s+/g,' ').trim();
function lookupWord(w){
  const ex=findWord(w); if(ex) return ex;
  const k=looseKey(w); if(!k) return null;
  return words.find(x=>looseKey(x.word)===k) || words.find(x=>looseKey(x.word).startsWith(k+' ')) || null;
}

/* 単語帳タブの該当単語へ移動 */
function jumpToWord(w){
  showTab('words');
  $('q').value='';
  if(hideMeaning) revealed.add(w.id);
  render(); flashItem(w.id);
}
/* 未登録の単語を単語帳の入力欄へ */
function prefillWord(text){
  showTab('words');
  fWord.value=text; fMean.value=''; updateExists();
  window.scrollTo({top:0,behavior:'smooth'});
  fMean.focus();
  toast('意味を入れて「追加」を押すと登録されます');
}
function wordChip(text,removable){
  const hit=lookupWord(text);
  const c=document.createElement('span');
  c.className='chip '+(hit?'reg':'unreg');
  const b=document.createElement('button');
  b.type='button'; b.style.cssText='background:transparent;color:inherit;padding:0;font:inherit;';
  b.innerHTML=esc(text)+(hit?' <small>'+esc(hit.meaning||'')+'</small>':' <small>+登録</small>');
  b.title=hit?'単語帳の「'+hit.word+'」へ':'単語帳に登録する';
  b.addEventListener('click',e=>{ e.stopPropagation(); hit?jumpToWord(hit):prefillWord(text); });
  c.appendChild(b);
  if(removable){
    const x=document.createElement('button');
    x.type='button'; x.className='x'; x.textContent='×'; x.setAttribute('aria-label',text+'を外す');
    x.addEventListener('click',()=>{ draftWords=draftWords.filter(t=>t!==text); renderChips(); });
    c.appendChild(x);
  }
  return c;
}

/* --- 入力フォーム --- */
let draftWords=[], editingLog=null;
function renderChips(){
  const box=$('lChips'); box.innerHTML='';
  for(const t of draftWords) box.appendChild(wordChip(t,true));
}
function addDraftWord(){
  const parts=$('lWordIn').value.split(/[,、，]/).map(t=>t.trim()).filter(Boolean);
  for(const t of parts) if(!draftWords.some(x=>norm(x)===norm(t))) draftWords.push(t);
  $('lWordIn').value=''; renderChips();
}
$('lWordAdd').addEventListener('click',addDraftWord);
$('lWordIn').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); addDraftWord(); } });

function resetLogForm(keepBook){
  const book=$('lBookIn').value;
  $('logForm').reset();
  if(keepBook) $('lBookIn').value=book;   // 同じ問題集を続けて記録しやすいように
  draftWords=[]; editingLog=null; renderChips();
  $('logForm').classList.remove('editing');
  $('lSave').textContent='記録する'; $('lDel').hidden=true; $('lCancel').hidden=true;
}
function editLog(r){
  editingLog=r;
  $('lBookIn').value=r.book; $('lPage').value=r.page; $('lNum').value=r.num; $('lNote').value=r.note;
  draftWords=r.words.slice(); renderChips();
  $('logForm').classList.add('editing');
  $('lSave').textContent='更新する'; $('lDel').hidden=false; $('lCancel').hidden=false;
  $('logForm').scrollIntoView({behavior:'smooth',block:'start'});
}
$('logForm').addEventListener('submit',e=>{
  e.preventDefault();
  if($('lWordIn').value.trim()) addDraftWord();
  const r={book:$('lBookIn').value.trim(),page:$('lPage').value.trim(),num:$('lNum').value.trim(),
    note:$('lNote').value.trim(),words:draftWords.slice()};
  if(!r.book&&!r.page&&!r.num&&!r.note&&!r.words.length){ toast('テキスト名やページなどを入れてください'); return; }
  if(editingLog){ Object.assign(editingLog,r); toast('更新しました'); }
  else{ mistakes.push({id:uid(),...r,done:false,added:Date.now()}); toast('記録しました'); }
  saveLog(); resetLogForm(true); renderLog();
});
$('lCancel').addEventListener('click',()=>resetLogForm(false));
$('lDel').addEventListener('click',()=>{
  if(!editingLog) return;
  if(!confirm('この記録を削除しますか?')) return;
  mistakes=mistakes.filter(x=>x!==editingLog);
  saveLog(); resetLogForm(false); renderLog(); toast('削除しました');
});

/* --- 一覧 --- */
let logTodo=false;
$('lTodo').addEventListener('click',()=>{ logTodo=!logTodo; $('lTodo').classList.toggle('on',logTodo); renderLog(); });
$('lFilter').addEventListener('change',renderLog);
$('lq').addEventListener('input',renderLog);
const numCmp=(a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true});

function renderLog(){
  if(!$('tabLog').hidden) $('count').textContent=mistakes.length+'件';
  const books=[...new Set(mistakes.map(r=>r.book||'(テキスト名なし)'))].sort(numCmp);
  // 絞り込みと入力候補を更新
  const sel=$('lFilter'), cur=sel.value;
  sel.innerHTML='<option value="">すべてのテキスト</option>'+books.map(b=>'<option>'+esc(b)+'</option>').join('');
  sel.value=books.includes(cur)?cur:'';
  $('bookList').innerHTML=books.filter(b=>b!=='(テキスト名なし)').map(b=>'<option value="'+esc(b)+'">').join('');

  const q=$('lq').value.trim().toLowerCase();
  const shown=mistakes.filter(r=>{
    if(sel.value && (r.book||'(テキスト名なし)')!==sel.value) return false;
    if(logTodo && r.done) return false;
    if(q && ![r.book,r.note,r.page,r.num,...r.words].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
  const list=$('logList'); list.innerHTML='';
  $('logEmpty').hidden=shown.length>0;
  $('logEmpty').textContent=mistakes.length?'条件に合う記録はありません':'まだ記録がありません。間違えた問題のテキスト名・ページ・番号を上の欄に入れてください。';

  const groups=new Map();
  for(const r of shown){ const b=r.book||'(テキスト名なし)'; if(!groups.has(b)) groups.set(b,[]); groups.get(b).push(r); }
  for(const b of [...groups.keys()].sort(numCmp)){
    const items=groups.get(b).sort((x,y)=>numCmp(x.page,y.page)||numCmp(x.num,y.num));
    const sec=document.createElement('section'); sec.className='book';
    const left=items.filter(r=>!r.done).length;
    sec.innerHTML='<h2>'+esc(b)+'<span class="n">'+items.length+'件'+(left?'・未復習 '+left:'')+'</span></h2>';
    for(const r of items){
      const card=document.createElement('div'); card.className='entry'+(r.done?' done':'');
      const top=document.createElement('div'); top.className='top';
      const where=document.createElement('button'); where.type='button'; where.className='where';
      const label=[r.page?'p.'+r.page:'',r.num?'No.'+r.num:''].filter(Boolean).join(' ')||'(ページ・番号なし)';
      where.innerHTML=esc(label)+'<small>編集</small>';
      where.addEventListener('click',()=>editLog(r));
      const done=document.createElement('button'); done.type='button';
      done.className='ghost donebtn'+(r.done?' on':''); done.textContent=r.done?'✓ 復習OK':'復習OK';
      done.setAttribute('aria-pressed',r.done);
      done.addEventListener('click',()=>{ r.done=!r.done; saveLog(); renderLog(); });
      top.append(where,done); card.appendChild(top);
      if(r.note){ const n=document.createElement('div'); n.className='note'; n.textContent=r.note; card.appendChild(n); }
      if(r.words.length){ const c=document.createElement('div'); c.className='chips'; for(const t of r.words) c.appendChild(wordChip(t,false)); card.appendChild(c); }
      sec.appendChild(card);
    }
    list.appendChild(sec);
  }
}

/* ================= 初期データ(最初に書き溜めていた単語) ================= */
function seed(){
  const text=`Competent…有能
Exclusively…限定≒only
Sensible…実用的
yet…だが

Predictably…予想通り

Quote…見積もりを提示する
Ensure…確実にする
Discontinue…中止

irrigation…灌漑

How-to…やり方(形容詞)
an ——— 形 名…→型or副
a range of…種類
Legible…読みやすい
Follow-up…その後の
Exceptional…素晴らしく
So far…これまでのところ
will form…結成するつもり
within a short walking distance…徒歩ですぐの距離
dispose of…〇〇を処分する
to have 〇 原型動詞…〇に〜させる

Had(文頭)…仮定法過去完了形「もしあのとき〜だったら〜だっただろう」→(would/could/might)+have +過去分詞
before/after…+節(SV)/名詞

Reinforce…強固にする
Account for 〇…〇の割合を占める
with O 分詞…「〜した状態/〜された状態」
size…〜サイズで作る、他動詞
than 過去分詞…〜されたより
when + 分詞…whenの後は分詞→〜ing,〜ed
Wholesome…健康に良い

Although…〜だが
However…しかしながら
Once…したらすぐに(接続詞)

Alike…同様に(副詞)
Alike…よく似た(形容詞)
rather…かなり
Likewise…同様に、〜もまた
Since…〜なので
Whereas…〜であるのに対して
In case…〜が理由で
Except…〜を除く
In particular…特に(副詞)
Therefore…それゆえ
Given that…〜を考慮すると
In order to…〜するために
Prior to…〜の前に
Proceed…〜を始める、着手する
Then…そのとき
Even though…〜だが
Rather than…〜ではなく、〜より、むしろ
So that S can V…SがVできるよう
Would…〜だろう
As well as…〜に加えて
Absence…欠席
Query…質問
Tend…〜しがち、〜する傾向
Persuasive…説得力のある
On 〇〇 behalf…〇〇の代わりに
Cuisine…料理
Throughout…〜中ずっと(時間)、至る所に
Onto…〜の方へ、〜へ向けられて、〜に面して
Direction…方向、指示
Along…前へ、先へ
Into…Xを加工してYにする
Over the 〇〇(時)…〜にわたって
From 〇〇 to 〇〇…〇〇から〇〇まで
By 〇〇…〇〇までに
At 〇〇…(点をイメージ)

In accordance with…(ルールなど)に従って

Whoever…〜する人は誰でも

Consist of…〜で構成された
Distinguished…著名な`;
  // 区切りは「…」だけ(意味の中の「→」で切らないように)
  const out=[]; const t0=Date.now()-100000;
  text.split('\n').forEach((line,i)=>{
    const k=line.indexOf('…');
    const word=line.slice(0,k).trim(), meaning=line.slice(k+1).trim();
    const ex=out.find(x=>norm(x.word)===norm(word));
    if(ex){ ex.meaning+=' / '+meaning; return; }

  return out;
