<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161d29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>雨の窓</title>
<style>
  :root{
    --night:#161d29; --cloud:#232e40; --mist:#8fa3bf;
    --glass:#dce6f2; --lamp:#e8c47a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:linear-gradient(180deg,#10151f 0%,var(--night) 40%,#1c2636 100%);
    color:var(--glass);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .rain{position:fixed;inset:-10% 0;pointer-events:none;opacity:0;transition:opacity 1.5s;}
  .rain span{
    position:absolute;top:-15%;width:1px;height:14vh;
    background:linear-gradient(180deg,transparent,rgba(180,200,230,.45));
    animation:fall linear infinite;
  }
  @keyframes fall{to{transform:translateY(130vh);}}
  #flash{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%,rgba(230,240,255,.95),rgba(180,200,240,.55) 45%,transparent 80%);
    opacity:0;
  }
  .pane{
    position:relative;z-index:2;width:min(400px,92vw);
    padding:36px 32px 30px;
    background:rgba(22,29,41,.72);
    border:1px solid rgba(143,163,191,.25);
    border-radius:14px;backdrop-filter:blur(6px);
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;
     font-size:1.5rem;letter-spacing:.35em;text-align:center;margin-bottom:4px;}
  .sub{text-align:center;font-size:.72rem;letter-spacing:.2em;color:var(--mist);margin-bottom:28px;}
  .playwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;}
  #playBtn{
    width:84px;height:84px;border-radius:50%;
    border:1px solid rgba(232,196,122,.5);
    background:radial-gradient(circle at 35% 30%,rgba(232,196,122,.22),rgba(232,196,122,.06));
    color:var(--lamp);font-size:1.6rem;cursor:pointer;
    transition:box-shadow .4s,transform .15s;
  }
  #playBtn:hover{box-shadow:0 0 28px rgba(232,196,122,.35);}
  #playBtn:active{transform:scale(.96);}
  #playBtn:focus-visible{outline:2px solid var(--lamp);outline-offset:3px;}
  #playBtn.on{box-shadow:0 0 34px rgba(232,196,122,.45);}
  #status{font-size:.7rem;letter-spacing:.15em;color:var(--mist);min-height:1em;}
  .ctrl{margin-bottom:20px;}
  .ctrl label{display:flex;justify-content:space-between;font-size:.78rem;
    letter-spacing:.12em;color:var(--mist);margin-bottom:8px;}
  .ctrl label b{color:var(--glass);font-weight:600;}
  input[type=range]{width:100%;appearance:none;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--mist),rgba(143,163,191,.25));cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;
    border-radius:50%;background:var(--glass);border:1px solid var(--mist);}
  input[type=range]:focus-visible{outline:2px solid var(--glass);outline-offset:4px;}
  .timers{display:flex;gap:8px;justify-content:center;margin-top:6px;}
  .timers button{flex:1;padding:8px 0;font-size:.75rem;letter-spacing:.1em;
    background:transparent;color:var(--mist);
    border:1px solid rgba(143,163,191,.3);border-radius:8px;cursor:pointer;transition:all .25s;}
  .timers button:hover{color:var(--glass);border-color:var(--mist);}
  .timers button.sel{color:var(--lamp);border-color:rgba(232,196,122,.6);background:rgba(232,196,122,.08);}
  #countdown{text-align:center;font-size:.75rem;letter-spacing:.25em;color:var(--mist);
    margin-top:14px;min-height:1.1em;font-variant-numeric:tabular-nums;}
  @media (prefers-reduced-motion:reduce){.rain span{animation:none;display:none;}}
</style>
</head>
<body>

<div class="rain" id="rainFx"></div>
<div id="flash"></div>

<main class="pane">
  <h1>雨の窓</h1>
  <p class="sub">RAIN ON THE WINDOW</p>

  <div class="playwrap">
    <button id="playBtn" aria-label="再生 / 停止">▶</button>
    <p id="status"></p>
  </div>

  <div class="ctrl">
    <label><span>雨の強さ</span><b id="rainVal">ふつう</b></label>
    <input type="range" id="rainSlider" min="0" max="100" value="55" aria-label="雨の強さ">
  </div>

  <div class="ctrl">
    <label><span>窓のパタパタ</span><b id="patVal">ふつう</b></label>
    <input type="range" id="patSlider" min="0" max="100" value="55" aria-label="窓に当たる雨粒の音">
  </div>

  <div class="ctrl">
    <label><span>雷の頻度</span><b id="thVal">ときどき</b></label>
    <input type="range" id="thSlider" min="0" max="100" value="45" aria-label="雷の頻度">
  </div>

  <div class="ctrl">
    <label><span>タイマー</span></label>
    <div class="timers">
      <button data-min="20" class="sel">20分</button>
      <button data-min="40">40分</button>
      <button data-min="60">60分</button>
      <button data-min="0">∞</button>
    </div>
  </div>

  <p id="countdown"></p>
</main>

<audio id="player" loop playsinline></audio>

<script>
/* ================= visual rain ================= */
const rainFx=document.getElementById('rainFx');
for(let i=0;i<70;i++){
  const s=document.createElement('span');
  s.style.left=Math.random()*100+'%';
  s.style.animationDuration=(0.6+Math.random()*0.7)+'s';
  s.style.animationDelay=(-Math.random()*2)+'s';
  s.style.opacity=0.3+Math.random()*0.7;
  rainFx.appendChild(s);
}

/* ================= elements ================= */
const playBtn=document.getElementById('playBtn');
const statusEl=document.getElementById('status');
const rainSlider=document.getElementById('rainSlider');
const patSlider=document.getElementById('patSlider');
const thSlider=document.getElementById('thSlider');
const flash=document.getElementById('flash');
const player=document.getElementById('player');

/* ================= WAV encode ================= */
function writeStr(dv,off,s){for(let i=0;i<s.length;i++)dv.setUint8(off+i,s.charCodeAt(i));}
function bufferToWav(abuf){
  const nCh=abuf.numberOfChannels, sr=abuf.sampleRate, len=abuf.length;
  const bytes=44+len*nCh*2;
  const ab=new ArrayBuffer(bytes), dv=new DataView(ab);
  writeStr(dv,0,'RIFF'); dv.setUint32(4,bytes-8,true); writeStr(dv,8,'WAVE');
  writeStr(dv,12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true);
  dv.setUint16(22,nCh,true); dv.setUint32(24,sr,true);
  dv.setUint32(28,sr*nCh*2,true); dv.setUint16(32,nCh*2,true); dv.setUint16(34,16,true);
  writeStr(dv,36,'data'); dv.setUint32(40,len*nCh*2,true);
  const chans=[]; for(let c=0;c<nCh;c++)chans.push(abuf.getChannelData(c));
  let off=44;
  for(let i=0;i<len;i++)for(let c=0;c<nCh;c++){
    let v=Math.max(-1,Math.min(1,chans[c][i]));
    dv.setInt16(off, v<0?v*32768:v*32767, true); off+=2;
  }
  return new Blob([ab],{type:'audio/wav'});
}
function silenceWav(){
  const sr=8000,len=800,bytes=44+len*2;
  const ab=new ArrayBuffer(bytes),dv=new DataView(ab);
  writeStr(dv,0,'RIFF');dv.setUint32(4,bytes-8,true);writeStr(dv,8,'WAVE');
  writeStr(dv,12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);
  dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);
  dv.setUint16(32,2,true);dv.setUint16(34,16,true);
  writeStr(dv,36,'data');dv.setUint32(40,len*2,true);
  return new Blob([ab],{type:'audio/wav'});
}

/* ================= offline synthesis =================
   150秒のループ音源をその場で生成し、audio要素で再生する。
   ファイル再生なのでバックグラウンドでも鳴り続ける。 */
let thunderTimes=[];   // ループ内の雷開始秒(稲光の同期用)
let currentUrl=null;

function noiseInto(ch){for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}

async function renderStorm(){
  const SR=32000, DUR=150;
  const oc=new OfflineAudioContext(2, SR*DUR, SR);
  const rv=rainSlider.value/100, pv=patSlider.value/100, tv=thSlider.value/100;

  /* ---- rain bed ---- */
  const bed=oc.createBuffer(2, SR*4, SR);
  noiseInto(bed.getChannelData(0)); noiseInto(bed.getChannelData(1));
  const bsrc=oc.createBufferSource(); bsrc.buffer=bed; bsrc.loop=true;
  const hp=oc.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=350;
  const lp=oc.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900+rv*4800;
  const bg=oc.createGain();
  const base=0.04+rv*0.30;
  bg.gain.setValueAtTime(base,0);
  for(let t=10;t<DUR-5;t+=10+Math.random()*8){          // ゆるい強弱の揺らぎ
    bg.gain.linearRampToValueAtTime(base*(0.85+Math.random()*0.3), t);
  }
  bg.gain.linearRampToValueAtTime(base, DUR);            // ループ境界を揃える
  bsrc.connect(hp); hp.connect(lp); lp.connect(bg); bg.connect(oc.destination);
  bsrc.start(0);

  /* ---- window patter ---- */
  if(pv>0){
    const grain=oc.createBuffer(1, SR*2, SR);
    noiseInto(grain.getChannelData(0));
    const rate=2+pv*16;                                  // 1秒あたりの粒数
    let t=Math.random()*0.3;
    while(t<DUR-0.2){
      const src=oc.createBufferSource(); src.buffer=grain;
      const bp=oc.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.value=1200+Math.random()*3800;
      bp.Q.value=4+Math.random()*6;
      const g=oc.createGain();
      const a=(0.03+pv*0.20)*Math.random();
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(a, t+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.03+Math.random()*0.05);
      const pan=oc.createStereoPanner(); pan.pan.value=Math.random()*1.6-0.8;
      src.connect(bp); bp.connect(g); g.connect(pan); pan.connect(oc.destination);
      const offs=Math.random()*1.8;
      src.start(t, offs, 0.12); 
      t+=1/rate*(0.3+Math.random()*1.4);
    }
  }

  /* ---- rolling thunder (ゴロゴロ) ---- */
  thunderTimes=[];
  if(tv>0){
    const count=Math.max(1, Math.round(1+tv*3.2));       // ループ内 1〜4回
    const brown=oc.createBuffer(1, SR*14, SR);
    const bd=brown.getChannelData(0);
    let last=0;
    for(let i=0;i<bd.length;i++){
      const w=Math.random()*2-1; last=(last+0.02*w)/1.02; bd[i]=last*3.5;
    }
    for(let k=0;k<count;k++){
      const t0=10+Math.random()*(DUR-32)*( (k+Math.random()*0.6)/count );
      const dur=7+Math.random()*6;
      thunderTimes.push(t0);
      const src=oc.createBufferSource(); src.buffer=brown;
      const tlp=oc.createBiquadFilter(); tlp.type='lowpass';
      tlp.frequency.setValueAtTime(90+Math.random()*90, t0);
      tlp.frequency.exponentialRampToValueAtTime(40, t0+dur);
      const g=oc.createGain();
      g.gain.setValueAtTime(0,t0);
      let t=t0+0.4+Math.random()*0.8;
      let level=0.35+Math.random()*0.25;
      g.gain.linearRampToValueAtTime(level,t);
      const rolls=3+Math.floor(Math.random()*4);
      for(let i=0;i<rolls;i++){
        t+=0.5+Math.random()*1.2;
        g.gain.linearRampToValueAtTime(level*(0.25+Math.random()*0.35), t);
        t+=0.4+Math.random()*1.0;
        level*=0.75+Math.random()*0.2;
        g.gain.linearRampToValueAtTime(level,t);
      }
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      const pan=oc.createStereoPanner(); pan.pan.value=Math.random()*0.7-0.35;
      src.connect(tlp); tlp.connect(g); g.connect(pan); pan.connect(oc.destination);
      src.start(t0); src.stop(t0+dur+0.5);
    }
  }

  const rendered=await oc.startRendering();
  return bufferToWav(rendered);
}

/* ================= transport ================= */
let running=false, rendering=false;
let timerMin=20, timerEnd=null, tickInt=null, flashInt=null, fadeInt=null;
let firedFlash=new Set();

async function start(){
  if(rendering) return;
  rendering=true;
  playBtn.textContent='…';
  statusEl.textContent='嵐を用意しています…';
  // ユーザー操作の直後に一度再生して音声をアンロック(iOS対策)
  player.src=URL.createObjectURL(silenceWav());
  player.play().catch(()=>{});
  try{
    const wav=await renderStorm();
    if(currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl=URL.createObjectURL(wav);
    player.src=currentUrl;
    player.volume=1;
    await player.play();
  }catch(e){
    statusEl.textContent='再生できませんでした。もう一度押してください';
    playBtn.textContent='▶'; rendering=false; return;
  }
  rendering=false; running=true;
  statusEl.textContent='';
  rainFx.style.opacity=1;
  playBtn.textContent='❚❚'; playBtn.classList.add('on');

  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({
      title:'雨の窓', artist:'雷雨サウンド',
      artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]
    });
    navigator.mediaSession.setActionHandler('play',()=>{ if(!running) start(); });
    navigator.mediaSession.setActionHandler('pause',()=>{ if(running) stop(); });
  }

  timerEnd = timerMin>0 ? Date.now()+timerMin*60000 : null;
  clearInterval(tickInt); tickInt=setInterval(tick,500);
  firedFlash=new Set();
  clearInterval(flashInt); flashInt=setInterval(syncFlash,250);
}

function stop(){
  running=false;
  clearInterval(tickInt); clearInterval(flashInt); clearInterval(fadeInt);
  player.pause();
  timerEnd=null;
  rainFx.style.opacity=0;
  playBtn.textContent='▶'; playBtn.classList.remove('on');
  document.getElementById('countdown').textContent='';
}

/* 稲光をループ内の雷位置に同期(画面表示中のみ) */
function lightningFlash(strength){
  flash.style.transition='none';
  flash.style.opacity=Math.min(0.9,0.4+strength*0.6);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{
    flash.style.transition='opacity .12s'; flash.style.opacity=0;
    if(Math.random()<0.6) setTimeout(()=>{
      flash.style.transition='none'; flash.style.opacity=0.25+strength*0.3;
      requestAnimationFrame(()=>{requestAnimationFrame(()=>{
        flash.style.transition='opacity .8s'; flash.style.opacity=0;
      });});
    },90+Math.random()*120);
  });});
}
function syncFlash(){
  if(!running||document.hidden) return;
  const ct=player.currentTime;
  for(const t0 of thunderTimes){
    const lead=t0-1.8;                       // 音より少し先に光る
    const key=Math.floor(ct/150)+':'+t0;
    if(ct>=lead && ct<lead+0.3 && !firedFlash.has(key)){
      firedFlash.add(key);
      lightningFlash(0.3+Math.random()*0.4);
    }
  }
  if(ct<1) firedFlash.clear();               // ループ頭でリセット
}

/* ================= timer ================= */
function tick(){
  if(!timerEnd) return;
  const left=timerEnd-Date.now();
  const cd=document.getElementById('countdown');
  if(left<=0){ cd.textContent='おやすみなさい'; stop(); return; }
  if(left<12000 && !fadeInt){
    fadeInt=setInterval(()=>{
      player.volume=Math.max(0, player.volume-0.045);
    },500);
  }
  const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
  cd.textContent=`のこり ${m}:${String(s).padStart(2,'0')}`;
}

playBtn.addEventListener('click',()=>{ running?stop():start(); });

/* ================= controls ================= */
const rainLabels=['しとしと','小雨','ふつう','本降り','土砂降り'];
const patLabels=['なし','ぽつぽつ','ふつう','ぱたぱた','ばちばち'];
const thLabels=['なし','まれ','ときどき','よく鳴る','頻繁'];
function labelFor(v,arr){return arr[Math.min(arr.length-1,Math.floor(v/100*arr.length))];}

rainSlider.addEventListener('input',()=>{document.getElementById('rainVal').textContent=labelFor(rainSlider.value,rainLabels);});
patSlider.addEventListener('input',()=>{document.getElementById('patVal').textContent=labelFor(patSlider.value,patLabels);});
thSlider.addEventListener('input',()=>{document.getElementById('thVal').textContent=labelFor(thSlider.value,thLabels);});

/* スライダーを離したら作り直して差し替え */
async function reRender(){
  if(!running||rendering) return;
  rendering=true;
  statusEl.textContent='配合を変えています…';
  try{
    const wav=await renderStorm();
    if(currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl=URL.createObjectURL(wav);
    player.src=currentUrl;
    await player.play();
    firedFlash=new Set();
  }catch(e){}
  statusEl.textContent='';
  rendering=false;
}
rainSlider.addEventListener('change',reRender);
patSlider.addEventListener('change',reRender);
thSlider.addEventListener('change',reRender);

document.querySelectorAll('.timers button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.timers button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    timerMin=Number(b.dataset.min);
    if(running){
      timerEnd = timerMin>0 ? Date.now()+timerMin*60000 : null;
      clearInterval(fadeInt); fadeInt=null; player.volume=1;
      if(!timerEnd) document.getElementById('countdown').textContent='';
    }
  });
});

/* ================= service worker ================= */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
