<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>ES深掘りノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f3f4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ES深掘り">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  /* レイアウト：1カラムの「面接ノート」。設問カードの下に、質問→回答→さらに深い質問が字下げで連なる */
  :root{
    --bg:#f3f4f7; --card:#ffffff; --ink:#1b2033; --sub:#636a7e; --line:#dfe2ea;
    --accent:#2f3f8f; --accent-ink:#ffffff; --soft:#e8ebf7;
    --seal:#c2402d; --seal-bg:#fbe7e3; --ok:#1f7a4c; --ok-bg:#e1f2e8; --warn:#9a6200; --warn-bg:#fbefd8;
    --why:#6b46c1; --num:#0e7c7c; --spec:#2f3f8f; --repro:#9a6200; --corp:#c2402d; --person:#56627a; --ai:#a03f8e;
    --shadow:0 10px 28px rgba(27,32,51,.16);
    --f-head:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;
    --f-body:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161d; --card:#1d2029; --ink:#e7e9f0; --sub:#9aa0b0; --line:#2c303c;
      --accent:#8fa2ff; --accent-ink:#11131a; --soft:#232a45;
      --seal:#ff8a76; --seal-bg:#3a1f1a; --ok:#62cf93; --ok-bg:#16301f; --warn:#f0c060; --warn-bg:#33290f;
      --why:#b79bff; --num:#55d0d0; --spec:#8fa2ff; --repro:#f0c060; --corp:#ff8a76; --person:#aab5c8; --ai:#f08ad8;
      --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161d; --card:#1d2029; --ink:#e7e9f0; --sub:#9aa0b0; --line:#2c303c;
    --accent:#8fa2ff; --accent-ink:#11131a; --soft:#232a45;
    --seal:#ff8a76; --seal-bg:#3a1f1a; --ok:#62cf93; --ok-bg:#16301f; --warn:#f0c060; --warn-bg:#33290f;
    --why:#b79bff; --num:#55d0d0; --spec:#8fa2ff; --repro:#f0c060; --corp:#ff8a76; --person:#aab5c8; --ai:#f08ad8;
    --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;min-height:100vh;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
  button,input,textarea,select{font:inherit;color:inherit;}
  button{cursor:pointer;}
  a{color:var(--accent);}
  .wrap{max-width:760px;margin:0 auto;padding-block:16px 104px;}
  header.top{display:flex;align-items:center;gap:8px;margin:4px 0 16px;}
  header.top h1{font-family:var(--f-head);font-size:1.2rem;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em;}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-size:.86rem;white-space:nowrap;}
  .btn:hover{border-color:var(--sub);}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;}
  .btn.small{padding:4px 9px;font-size:.78rem;}
  .btn.danger{color:var(--seal);}
  .btn.ai{color:var(--ai);border-color:color-mix(in srgb,var(--ai) 40%,var(--line));}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn:focus-visible,.icon:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .icon{border:none;background:transparent;min-width:36px;height:36px;border-radius:8px;font-size:1.05rem;color:var(--sub);}
  .icon:hover{background:var(--line);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
  .muted{color:var(--sub);font-size:.84rem;}
  .empty{text-align:center;color:var(--sub);padding:36px 12px;line-height:1.9;}
  .empty b{color:var(--ink);}
  .banner{font-size:.82rem;color:var(--sub);background:var(--soft);border-radius:10px;padding:8px 12px;margin-bottom:12px;}
  .search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:12px;}
  .co{display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap;}
  .co .name{font-family:var(--f-head);font-weight:700;font-size:1.02rem;}
  .co .meta{font-size:.8rem;color:var(--sub);}
  .co .grow{flex:1;min-width:0;}
  .pill{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:700;white-space:nowrap;}
  .pill.seal{background:var(--seal-bg);color:var(--seal);}
  .pill.warn{background:var(--warn-bg);color:var(--warn);}
  .pill.ok{background:var(--ok-bg);color:var(--ok);}
  .pill.gray{background:var(--line);color:var(--sub);}
  label.f{display:block;font-size:.78rem;color:var(--sub);margin:10px 0 4px;}
  input.t,textarea.t,select.t{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);}
  input.t:focus,textarea.t:focus,select.t:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;}
  textarea.t{resize:vertical;min-height:120px;line-height:1.75;}
  textarea.note{min-height:60px;font-size:.88rem;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row>*{flex:1;min-width:140px;}
  .qhead{display:flex;gap:8px;align-items:flex-start;}
  .qhead .qt-in{flex:1;font-weight:700;min-width:0;}
  .qhead .lim{width:96px;flex:none;}
  .count{display:flex;justify-content:flex-end;font-size:.78rem;color:var(--sub);margin-top:4px;font-variant-numeric:tabular-nums;}
  .count .over{color:var(--seal);font-weight:700;}
  .count .short{color:var(--warn);}
  .check{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:8px;align-items:center;}
  .check .lbl{font-size:.74rem;color:var(--sub);margin-right:2px;}
  .chk{font-size:.72rem;padding:1px 7px;border-radius:6px;border:1px dashed var(--line);color:var(--sub);}
  .chk.on{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-bg);}
  .dd{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;}
  .dd-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .dd-h h3{font-family:var(--f-head);font-size:.92rem;flex:1;min-width:160px;}
  .types{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .dq{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--bg);}
  .kids .dq{background:var(--card);}
  .kids .kids .dq{background:var(--bg);}
  .dq>summary{list-style:none;display:flex;gap:8px;align-items:flex-start;padding:9px 10px;cursor:pointer;font-size:.9rem;}
  .dq>summary::-webkit-details-marker{display:none;}
  .tag{flex:none;font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:6px;border:1px solid currentColor;margin-top:3px;line-height:1.5;}
  .dq .qt{flex:1;min-width:0;}
  .dq .meta{flex:none;display:flex;gap:6px;align-items:center;font-size:.74rem;color:var(--sub);}
  .dq .done{color:var(--ok);font-weight:700;}
  .dq .lv{font-variant-numeric:tabular-nums;}
  .dq>.body{padding:0 10px 10px;}
  .intent{font-size:.78rem;color:var(--sub);margin-bottom:6px;}
  .kids{margin-top:8px;padding-left:10px;border-left:2px solid var(--line);}
  .kids-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.78rem;color:var(--sub);margin-bottom:6px;}
  .kids-h span{flex:1;min-width:120px;}
  .tag.why{color:var(--why);} .tag.num{color:var(--num);} .tag.spec{color:var(--spec);}
  .tag.repro{color:var(--repro);} .tag.corp{color:var(--corp);} .tag.person{color:var(--person);} .tag.ai{color:var(--ai);}
  .hint{font-size:.8rem;color:var(--sub);padding:2px 2px 8px;}
  .hint.warn{color:var(--warn);}
  .err{font-size:.82rem;color:var(--seal);margin:6px 0;}
  .fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
    border-radius:999px;padding:13px 20px;box-shadow:var(--shadow);font-size:.95rem;z-index:5;}
  dialog{border:none;border-radius:16px;background:var(--card);color:var(--ink);padding:20px;width:min(540px,calc(100vw - 32px));max-height:calc(100vh - 48px);margin:auto;}
  dialog::backdrop{background:rgba(10,12,20,.5);}
  dialog h2{font-family:var(--f-head);font-size:1.05rem;margin-bottom:6px;}
  .dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;align-items:center;}
  .dlg-actions .sp{flex:1;}
  .practice-q{font-family:var(--f-head);font-size:1.15rem;font-weight:700;line-height:1.6;margin:10px 0 8px;}
  .practice-chain{font-size:.8rem;color:var(--sub);background:var(--bg);border-radius:8px;padding:8px 10px;max-height:160px;overflow:auto;white-space:pre-wrap;}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:8px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:calc(100vw - 32px);}
  .toast.show{opacity:1;}
  @media (max-width:560px){ .qhead{flex-wrap:wrap;} .qhead .qt-in{flex:1 1 100%;} .qhead .lim{width:110px;} .qhead .q-del{margin-left:auto;} }
  @media (prefers-reduced-motion:reduce){ .toast{transition:none;} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlgCompany">
  <form id="formCompany">
    <h2 id="dlgCompanyTitle">企業を追加</h2>
    <label class="f" for="cName">企業名</label>
    <input class="t" id="cName" required placeholder="例：〇〇商事">
    <div class="row">
      <div><label class="f" for="cIndustry">業界・職種</label><input class="t" id="cIndustry" placeholder="例：総合商社 / 営業"></div>
      <div><label class="f" for="cStatus">選考状況</label>
        <select class="t" id="cStatus">
          <option>ES作成中</option><option>ES提出済</option><option>一次面接</option><option>二次面接</option>
          <option>最終面接</option><option>内定</option><option>見送り</option>
        </select></div>
    </div>
    <div class="row">
      <div><label class="f" for="cDeadline">締切</label><input class="t" id="cDeadline" type="date"></div>
      <div><label class="f" for="cUrl">マイページURL</label><input class="t" id="cUrl" type="url" placeholder="https://"></div>
    </div>
    <label class="f" for="cMemo">企業メモ（事業・社風・説明会で聞いたこと）</label>
    <textarea class="t note" id="cMemo"></textarea>
    <div class="dlg-actions">
      <button class="btn danger" type="button" id="btnDeleteCompany" hidden>削除</button>
      <span class="sp"></span>
      <button class="btn" type="button" id="btnCompanyCancel">キャンセル</button>
      <button class="btn primary" type="submit">保存</button>
    </div>
  </form>
</dialog>

<dialog id="dlgConfirm">
  <h2 id="confirmMsg"></h2>
  <div class="dlg-actions">
    <button class="btn" type="button" id="confirmNo">キャンセル</button>
    <button class="btn primary" type="button" id="confirmYes">OK</button>
  </div>
</dialog>

<dialog id="dlgSettings">
  <h2>設定</h2>
  <p class="muted" id="aiStatus"></p>
  <label class="f">バックアップ</label>
  <div class="row">
    <button class="btn" type="button" id="btnExport">書き出し（JSON）</button>
    <button class="btn" type="button" id="btnImport">読み込み</button>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </div>
  <p class="muted" style="margin-top:8px" id="storeStatus"></p>
  <div class="dlg-actions"><button class="btn primary" type="button" id="btnSettingsClose">閉じる</button></div>
</dialog>

<dialog id="dlgPractice">
  <h2 id="pTitle">面接練習</h2>
  <div class="muted" id="pFrom"></div>
  <div class="practice-chain" id="pChain"></div>
  <div class="practice-q" id="pQ"></div>
  <label class="f" for="pNote">あなたの答え（メモ）</label>
  <textarea class="t note" id="pNote" placeholder="話す内容の要点をメモ。書くと、この答えへの深掘りに進めます"></textarea>
  <div class="dlg-actions">
    <button class="btn" type="button" id="pClose">終了</button>
    <span class="sp"></span>
    <button class="btn" type="button" id="pDeeper">↳ さらに深掘り</button>
    <button class="btn primary" type="button" id="pNext">次の質問</button>
  </div>
</dialog>

<script>
'use strict';
/* ================= 共通 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
const countChars = s => [...String(s || '').replace(/\r?\n/g, '')].length;
function clip(s, n) { s = String(s).trim(); return [...s].length > n ? [...s].slice(0, n).join('') + '…' : s; }
function askConfirm(msg, okLabel) {
  return new Promise(res => {
    const d = $('#dlgConfirm'); $('#confirmMsg').textContent = msg; $('#confirmYes').textContent = okLabel || 'OK';
    const done = v => { d.close(); res(v); };
    $('#confirmYes').onclick = () => done(true); $('#confirmNo').onclick = () => done(false);
    d.oncancel = () => res(false);
    d.showModal();
  });
}

/* ================= 保存（claude.aiでは本人だけのDB、それ以外はこの端末） ================= */
const LOCAL_KEY = 'es-deepdive-v1';
const caps = { db: null, col: null, sample: null, downloads: null };
let state = { companies: [] };
let ready = false;
const saveTimers = {};

function loadLocal() {
  try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY)); if (d && Array.isArray(d.companies)) return d; } catch (e) {}
  return { companies: [] };
}
function writeLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch (e) {} }
function normalize(c) {
  c.questions = Array.isArray(c.questions) ? c.questions : [];
  c.questions.forEach(q => { q.notes = q.notes || {}; q.ai = Array.isArray(q.ai) ? { root: q.ai } : (q.ai || {}); });
  return c;
}
function saveCompany(c, now) {
  clearTimeout(saveTimers[c.id]);
  const run = async () => {
    delete saveTimers[c.id];
    if (!caps.col) { writeLocal(); return; }
    try { await caps.col.doc(c.id).set(JSON.parse(JSON.stringify(c))); }
    catch (e) { toast(e && e.code === 'resource_exhausted' ? 'データが大きすぎて保存できません' : '保存に失敗しました。通信を確認してください'); }
  };
  if (now) run(); else saveTimers[c.id] = setTimeout(run, 700);
}
async function removeCompany(c) {
  clearTimeout(saveTimers[c.id]);
  state.companies = state.companies.filter(x => x !== c);
  if (caps.col) { try { await caps.col.doc(c.id).delete(); } catch (e) { toast('削除に失敗しました'); } }
  else writeLocal();
}
function flushAll() { Object.keys(saveTimers).forEach(id => { const c = state.companies.find(x => x.id === id); if (c) saveCompany(c, true); }); }
window.addEventListener('pagehide', flushAll);

async function initStore() {
  const hasClaude = typeof window.claude === 'object' && window.claude && typeof window.claude.use === 'function';
  if (!hasClaude) { state = loadLocal(); state.companies.forEach(normalize); ready = true; render(); registerSW(); return; }
  // claude.ai の中：AIはあなたのプランで、データはあなた専用の保存場所へ
  window.claude.use('sample').then(s => { caps.sample = s; if (ready) render(); });
  window.claude.use('downloads').then(d => { caps.downloads = d; });
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  const id = user ? await user.id().catch(() => null) : null;
  if (db && id) {
    caps.db = db; caps.col = db.collection('data/users/' + id);
    const slow = setTimeout(() => { if (!ready) { $('#app').innerHTML = `<div class="empty">保存データに接続できません。<br>通信状況を確認して、ページを開き直してください。</div>`; } }, 10000);
    try {
      const snap = await caps.col.get();
      state = { companies: snap.docs.map(d => normalize({ ...d.data(), id: d.id })) };
    } catch (e) { toast('データを読み込めませんでした'); }
    clearTimeout(slow);
  } else {
    state = loadLocal(); state.companies.forEach(normalize);
  }
  ready = true; render();
}
function registerSW() { if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {}); }

/* ================= 深掘りエンジン ================= */
const CAT = { why: 'なぜ', spec: '具体化', num: '数字', repro: '再現性', corp: '企業理解', person: '人柄', ai: 'AI' };
const TYPES = [
  { id: 'motive', label: '志望動機', re: /志望|なぜ当社|当社を|弊社を|選んだ理由|応募した理由|魅力/ },
  { id: 'gakuchika', label: 'ガクチカ', re: /学生時代|力を入れ|打ち込|取り組んだ|ガクチカ|最も頑張/ },
  { id: 'pr', label: '自己PR・強み', re: /自己PR|自己ＰＲ|強み|長所|アピール|あなたらしさ/ },
  { id: 'weak', label: '短所・弱み', re: /短所|弱み|苦手/ },
  { id: 'failure', label: '挫折・困難', re: /挫折|失敗|困難|苦労|壁|乗り越え|逆境/ },
  { id: 'team', label: 'チーム経験', re: /チーム|周囲|協力|巻き込|リーダー|組織/ },
  { id: 'value', label: '価値観', re: /価値観|大切にして|大事にして|信念|モットー|譲れない/ },
  { id: 'future', label: '入社後・キャリア', re: /入社後|将来|キャリア|実現したい|挑戦したい|ビジョン|年後|成し遂げ/ },
  { id: 'research', label: '研究・ゼミ', re: /研究|卒論|卒業論文|ゼミ|専攻/ },
];
const TEMPLATES = {
  motive: [
    ['corp', '同業他社ではなく、なぜ{co}なのですか？'],
    ['corp', '{co}のどんな取り組みに魅力を感じましたか？'],
    ['why', 'その業界に興味を持った原体験は何ですか？'],
    ['corp', '他にどんな企業を受けていますか？共通する軸は？'],
    ['repro', '入社後、どのように活躍したいですか？'],
    ['repro', 'そのために、今どんな準備をしていますか？'],
  ],
  gakuchika: [
    ['why', 'その活動を始めた理由は何ですか？'],
    ['spec', '具体的に、あなたは何をしましたか？'],
    ['spec', 'うまくいかなかったとき、どう乗り越えましたか？'],
    ['spec', '周りを巻き込むために、どんな工夫をしましたか？'],
    ['repro', 'その経験から何を学び、仕事でどう活かせますか？'],
  ],
  pr: [
    ['spec', 'その強みが発揮された具体的な場面はどこですか？'],
    ['why', 'その強みはどのような経験から身についたのですか？'],
    ['person', 'その強みは、周りの人からどう評価されていますか？'],
    ['person', '逆に、あなたの弱みは何ですか？どう改善していますか？'],
    ['repro', 'その強みは、{co}の仕事のどんな場面で活きますか？'],
  ],

const NUM_UNITS = '%|％|人|名|件|倍|円|万円|万|割|時間|分|秒|日|週間|ヶ月|か月|カ月|年|位|社|回|点|kg|km';
const NUM_RE = new RegExp(`[0-9０-９][0-9０-９,，.．]*\\s*(?:${NUM_UNITS})`, 'g');
const HAS_NUM = new RegExp(NUM_RE.source);

function detectTypes(title) {
  const t = TYPES.filter(x => x.re.test(title || ''));
  return t.length ? t : [{ id: 'other', label: 'その他' }];

function sentences(text) { return String(text || '').split(/(?<=[。！？!?\n])/).map(s => s.trim()).filter(Boolean); }
function trimLead(s) {
  s = String(s).trim();
  const parts = s.split(/[、，,]/); const last = parts[parts.length - 1].trim();
  if (parts.length > 1 && [...last].length >= 6) s = last;
  return s.replace(/^(そこで|そのため|まず|次に|さらに|そして|しかし|また|特に|私は|私が)/, '').trim();
}
function makeAdder() {
  const out = [], seen = new Set();
  const add = (cat, q, intent) => { if (seen.has(q)) return; seen.add(q); out.push({ cat, q, intent: intent || '' }); };
  return { out, add };
}
// 文章（ESの回答、または深掘りへの答え）の中身から質問を作る
function analyzeText(text, add, co, opts = {}) {
  const ans = String(text || '').trim(); if (!ans) return;
  const sents = sentences(ans), first = sents[0] || '';
  if (opts.lead && first && [...first].length <= 70)
    add('why', `冒頭で「${clip(first.replace(/[。！？]$/, ''), 40)}」と書かれていますが、それを一番よく表すエピソードは何ですか？`, '結論と根拠が一致しているかを確認する');
  const pairs = [...ans.matchAll(new RegExp(`(${NUM_RE.source})から(${NUM_RE.source})`, 'g'))].map(m => [m[1].trim(), m[2].trim()]);
  if (pairs[0]) add('num', `「${pairs[0][0]}→${pairs[0][1]}」という変化は、どのように測りましたか？そのうち、あなたの行動による効果はどれくらいですか？`, '成果の測り方と自分の貢献を切り分けられるか');
  const used = new Set(pairs.slice(0, 1).flat());
  const nums = [...new Set((ans.match(NUM_RE) || []).map(s => s.trim()))].filter(n => !used.has(n));
  nums.slice(0, pairs[0] ? 1 : 2).forEach(n =>
    add('num', `「${n}」という数字は、どのように把握しましたか？何と比べてその数字なのですか？`, '数字の根拠と比較対象を説明できるか'));
  const reason = ans.match(/([^。！？\n]{6,40}?)(と考え|と思い|と感じ|と気づ|を痛感)/);
  if (reason) add('why', `「${clip(trimLead(reason[1]), 28)}」と考えたのはなぜですか？そう思ったきっかけは？`, '思考の出発点を問う');
  const act = ans.match(/([^。！？\n、]{2,24}?)(を提案|を導入|を改善|を工夫|を実施|を企画|を作成|を始め)/);
  if (act) {
    add('why', `「${clip(trimLead(act[1]), 20)}」を選んだのはなぜですか？ほかに検討した方法はありましたか？`, '選択肢を比べて判断したかを見る');
    add('spec', 'その取り組みに反対や懸念を示す人はいませんでしたか？どう説得しましたか？', '周囲を巻き込む力を見る');
  } else if (/提案|導入|改善|工夫|施策|企画/.test(ans)) {
    add('why', 'その方法を選んだ理由は何ですか？ほかに検討した方法はありましたか？', '選択肢を比べて判断したかを見る');
  }
  const leader = /(リーダー|代表|主将|部長|キャプテン|幹事|責任者|班長|委員長|座長)(として|を務め|に就任|に選ばれ|を任され)|私が(リーダー|代表|主将|部長)/.test(ans);
  if (leader) {
    add('spec', 'リーダーとして一番苦労したことは何ですか？意見が割れたときどう決めましたか？', 'リーダー経験の中身を確認する');
    add('person', 'メンバーからは、どんなリーダーだと言われていましたか？', '客観的な自己認識を見る');
  } else if (/チーム|メンバー|仲間|部員|サークル|部活|周囲|全員|みんな/.test(ans)) {
    add('spec', 'その中で、あなた自身の役割は何でしたか？あなたがいなかったら結果は変わっていましたか？', '個人の貢献を切り分けられるか');
  }
  if (/困難|苦労|大変|壁|課題|問題|うまくいかな|失敗|挫折/.test(ans)) add('spec', 'その課題の原因は何だと分析しましたか？', '原因分析の深さを見る');
  ABSTRACT.filter(w => ans.includes(w)).slice(0, 2).forEach(w =>
    add('spec', `あなたにとっての「${w}」とは、具体的にどういうことですか？`, '抽象的な言葉を自分の言葉で説明できるか'));
  EXPERIENCES.forEach(([re, cat, q]) => { if (re.test(ans)) add(cat, q); });
  if (/学んだ|学び|身につけ|身に付け|得た|気づいた|成長/.test(ans)) add('repro', 'その学びを、別の場面で活かした経験はありますか？', '再現性がある力かを確認する');
  if (/貴社|御社/.test(ans)) add('corp', `同業他社ではなく、なぜ${co}でなければいけないのですか？`, '志望度と企業研究の深さを見る');
}

function generateDeepDive(q, company) {
  const co = company.name || '当社';
  const { out, add } = makeAdder();
  const ans = (q.answer || '').trim();
  analyzeText(ans, add, co, { lead: true });
  if (ans && !HAS_NUM.test(ans) && countChars(ans) > 60 && detectTypes(q.title).some(t => ['gakuchika', 'pr', 'failure', 'team'].includes(t.id)))
    add('num', '成果や規模を数字で表すと、どのくらいになりますか？', '定量的に話せるよう準備しておく');
  detectTypes(q.title).forEach(t => (TEMPLATES[t.id] || []).forEach(([cat, text]) => add(cat, text.replace(/\{co\}/g, co))));
  if (ans) add('repro', '同じ状況にもう一度なったら、次はどこを変えますか？', '振り返りができるかを見る');
  return out.slice(0, 14);
}

const MAX_DEPTH = 5; // 1段目＋4段（なぜを5回）
function generateFollowUps(parent, note, company) {
  const co = company.name || '当社';
  const { out, add } = makeAdder();
  const ans = String(note || '').trim(); if (!ans) return [];
  const first = sentences(ans)[0] || '';
  if (first && [...first].length >= 8) add('why', `「${clip(first.replace(/[。！？]$/, ''), 30)}」とのことですが、なぜそう言えるのですか？`, '答えの根拠をさらに問う');
  analyzeText(ans, add, co);
  (CHAIN[parent.cat] || CHAIN.ai).forEach(([c, q, i]) => add(c, q, i));
  return out.filter(x => x.q !== parent.q).slice(0, 4);
}
function structureCheck(ans) { return STRUCTURE.map(([label, re]) => ({ label, on: re.test(ans || '') })); }

function chainText(chain) { return chain.map((x, i) => `質問${i + 1}：${x.q}\n答え${i + 1}：${x.a || '（未回答）'}`).join('\n\n'); }
async function aiQuestions(company, q, chain) {

`;

    ? `<interview>\n${chainText(chain)}\n</interview>

    : `条件:

- なぜ・具体化・数字・再現性・企業理解・人柄をバランスよく含める`;
  const data = await caps.sample.json(`${base}\n${task}\n- すべて日本語\n\n${AI_FORMAT}`, { modelTier: 'default' });

function aiErrorMessage(e) {

// ノードkey：1段目は "r.<hash>"、子は "<親key>.<hash>"。q.notes[key] に答え、q.ai[key] にAIの子質問
function topNodes(c, q) {
  const ai = (q.ai && q.ai.root) || [];
  return [...ai, ...generateDeepDive(q, c)].map(d => ({ ...d, key: 'r.' + hash(d.q), depth: 1 }));
}
function childNodes(c, q, node) {
  const note = (q.notes || {})[node.key] || '';
  if (!note.trim() || node.depth >= MAX_DEPTH) return [];
  const ai = (q.ai && q.ai[node.key]) || [];
  // すでに聞かれた質問（1段目と、この枝の上の段）は出さない
  const asked = new Set(topNodes(c, q).map(n => n.q));
  const idx = nodeIndexes.get(q.id);
  const parts = node.key.split('.');
  for (let i = 2; i <= parts.length; i++) { const n = idx && idx.get(parts.slice(0, i).join('.')); if (n) asked.add(n.q); }
  return [...ai, ...generateFollowUps(node, note, c)]
    .filter((d, i, arr) => arr.findIndex(x => x.q === d.q) === i && (d.ai || !asked.has(d.q)))
    .map(d => ({ ...d, key: node.key + '.' + hash(d.q), depth: node.depth + 1 }));
}
function chainFor(q, key, nodeIndex) {
  // key をさかのぼって、質問と答えの連なりを作る
  const parts = key.split('.'); const chain = [];
  for (let i = 2; i <= parts.length; i++) {
    const k = parts.slice(0, i).join('.'); const n = nodeIndex.get(k);
    if (n) chain.push({ q: n.q, a: (q.notes || {})[k] || '' });
  }
  return chain;
}

  return `<header class="top">
      <button class="icon" id="btnBack" aria-label="一覧に戻る">←</button>
      <h1>${esc(c.name)}</h1>
      <button class="btn" id="btnPractice" ${c.questions.length ? '' : 'disabled'}>面接練習</button>
      <button class="icon" id="btnEditCo" aria-label="企業情報を編集">✎</button>
    </header>
    <div class="card">
      <div class="row" style="align-items:center">
        <div class="muted">${esc(c.industry || '業界未設定')}${c.deadline ? ' ・ 締切 ' + esc(c.deadline) : ''}</div>
        <div style="flex:none"><span class="pill ${STATUS_CLASS[c.status] || ''}">${esc(c.status || '')}</span></div>
      </div>
      ${c.url ? `<div class="muted"><a href="${esc(c.url)}" target="_blank" rel="noopener">マイページを開く ↗</a></div>` : ''}
      ${c.memo ? `<div class="muted" style="white-space:pre-wrap;margin-top:6px">${esc(c.memo)}</div>` : ''}
    </div>
    ${qs || '<div class="empty">設問を追加して、ESの回答を書きましょう。</div>'}
    <button class="btn primary fab" id="btnAddQ">＋ 設問を追加</button>`;
}
function countHtml(q) {
  const n = countChars(q.answer), lim = Number(q.limit) || 0;
  let cls = ''; if (lim && n > lim) cls = 'over'; else if (lim && n < lim * 0.8 && n > 0) cls = 'short';
  return `<span class="cnt ${cls}">${n}${lim ? ' / ' + lim : ''} 字${cls === 'short' ? '（8割未満）' : cls === 'over' ? '（超過）' : ''}</span>`;
}
function checkHtml(q) {
  if (!(q.answer || '').trim()) return '';
  return `<span class="lbl">構成チェック</span>` + structureCheck(q.answer).map(x => `<span class="chk ${x.on ? 'on' : ''}">${x.on ? '✓' : '・'} ${x.label}</span>`).join('');
}
function typesHtml(q) { return detectTypes(q.title).map(t => `<span class="pill gray">${t.label}</span>`).join(''); }
function questionCard(c, q, i) {
  return `<section class="card q" data-qid="${esc(q.id)}">
    <div class="qhead">
      <input class="t qt-in" id="qt-${esc(q.id)}" placeholder="設問 ${i + 1}（例：学生時代に力を入れたことは？）" value="${esc(q.title)}" aria-label="設問">
      <input class="t lim" id="lim-${esc(q.id)}" type="number" min="0" step="50" inputmode="numeric" placeholder="字数" value="${esc(q.limit || '')}" aria-label="文字数制限">
      <button class="icon q-del" aria-label="設問を削除">🗑</button>
    </div>
    <textarea class="t ans" id="ans-${esc(q.id)}" placeholder="回答を書くと、内容に合わせた深掘り質問が下に表示されます" aria-label="回答">${esc(q.answer)}</textarea>
    <div class="count">${countHtml(q)}</div>
    <div class="check" title="記事で紹介されている自己PRの構成要素が入っているかの目安">${checkHtml(q)}</div>
    <div class="dd">
      <div class="dd-h"><h3>想定される深掘り質問</h3>
        <button class="btn small q-copy" type="button">コピー</button>
        <button class="btn small ai q-ai" type="button" ${caps.sample ? '' : 'hidden'}>✨ AIで深掘り</button></div>
      <div class="types">${typesHtml(q)}</div>
      <div class="dq-list">${deepDiveList(c, q)}</div>
    </div>
  </section>`;
}
function nodeHtml(c, q, node, idx) {
  idx.set(node.key, node);
  const note = (q.notes || {})[node.key] || '';
  const kids = childNodes(c, q, node);
  const nKids = kids.length;
  return `<details class="dq" data-k="${node.key}">
    <summary><span class="tag ${node.ai ? 'ai' : node.cat}">${node.ai ? 'AI・' : ''}${CAT[node.cat] || 'AI'}</span><span class="qt">${esc(node.q)}</span>
      <span class="meta">${note.trim() ? '<span class="done" aria-label="答えメモあり">✓</span>' : ''}${nKids ? `<span class="lv">↳${nKids}</span>` : ''}</span></summary>
    <div class="body">${node.intent ? `<div class="intent">ねらい：${esc(node.intent)}</div>` : ''}
      <textarea class="t note dq-note" id="n-${esc(q.id)}-${node.key}" placeholder="${node.depth >= MAX_DEPTH ? '答えをメモ' : '答えをメモすると、この答えへの深掘りが出てきます'}" aria-label="答えのメモ">${esc(note)}</textarea>
      <div class="kids-wrap">${kidsHtml(c, q, node, kids, idx)}</div>
    </div>
  </details>`;
}
function kidsHtml(c, q, node, kids, idx) {
  const note = ((q.notes || {})[node.key] || '').trim();
  if (!note) return '';
  if (node.depth >= MAX_DEPTH) return '<div class="hint">ここまで答えられれば十分です。最初の質問から通して話す練習をしましょう。</div>';
  const short = countChars(note) < 25 ? '<div class="hint warn">答えが短いと、面接官は深掘りの糸口を見つけにくくなります。背景・行動・結果まで書いてみましょう。</div>' : '';
  const err = q.aiErr && q.aiErr[node.key] ? `<div class="err">${esc(q.aiErr[node.key])}</div>` : '';
  return `<div class="kids">
      <div class="kids-h"><span>↳ この答えへの深掘り（${node.depth + 1}段目）</span>
        <button class="btn small ai k-ai" type="button" data-k="${node.key}" ${caps.sample ? '' : 'hidden'}>✨ AIで次の質問</button></div>
      ${short}${err}${kids.map(k => nodeHtml(c, q, k, idx)).join('')}
    </div>`;
}
function deepDiveList(c, q) {
  const idx = new Map(); nodeIndexes.set(q.id, idx);
  const hint = !(q.answer || '').trim() ? '<div class="hint">回答を書くと、内容（数字・行動・役割・抽象的な言葉など）に合わせた質問が追加されます。</div>' : '';
  const err = q.aiErr && q.aiErr.root ? `<div class="err">${esc(q.aiErr.root)}</div>` : '';
  return hint + err + topNodes(c, q).map(n => nodeHtml(c, q, n, idx)).join('');
}
function openKeys(container) { return [...container.querySelectorAll('details[open]')].map(d => d.dataset.k); }
function restoreOpen(container, keys) { keys.forEach(k => { const d = container.querySelector(`details[data-k="${k}"]`); if (d) d.open = true; }); }

function bindCompany(c) {
  $('#btnBack').onclick = () => { flushAll(); route = { view: 'home', id: null }; render(); };
  $('#btnEditCo').onclick = () => openCompanyDialog(c);
  $('#btnPractice').onclick = () => startPractice(c);
  $('#btnAddQ').onclick = () => {
    c.questions.push({ id: uid(), title: '', limit: '', answer: '', notes: {}, ai: {} });
    saveCompany(c); render();
    const cards = document.querySelectorAll('.q'); const last = cards[cards.length - 1];
    last.scrollIntoView({ behavior: 'smooth', block: 'center' }); last.querySelector('.qt-in').focus({ preventScroll: true });
  };
  document.querySelectorAll('.q').forEach(card => {
    const q = c.questions.find(x => x.id === card.dataset.qid);
    const list = card.querySelector('.dq-list');
    let t = null;
    const refreshList = () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const open = openKeys(list); list.innerHTML = deepDiveList(c, q); restoreOpen(list, open);
        card.querySelector('.types').innerHTML = typesHtml(q);
        card.querySelector('.check').innerHTML = checkHtml(q);
      }, 450);
    };
    card.querySelector('.qt-in').oninput = e => { q.title = e.target.value; saveCompany(c); refreshList(); };
    card.querySelector('.lim').oninput = e => { q.limit = e.target.value; saveCompany(c); card.querySelector('.count').innerHTML = countHtml(q); };
    card.querySelector('.ans').oninput = e => { q.answer = e.target.value; saveCompany(c); card.querySelector('.count').innerHTML = countHtml(q); refreshList(); };
    card.querySelector('.q-del').onclick = async () => {
      if (!await askConfirm('この設問と深掘りメモを削除しますか？', '削除')) return;
      c.questions = c.questions.filter(x => x !== q); saveCompany(c, true); render();
    };
    // 深掘りへの答え → その答えへの深掘りを更新
    const kidTimers = {};
    list.addEventListener('input', e => {
      if (!e.target.classList.contains('dq-note')) return;
      const det = e.target.closest('details'); const k = det.dataset.k;
      q.notes[k] = e.target.value; saveCompany(c);
      clearTimeout(kidTimers[k]);
      kidTimers[k] = setTimeout(() => refreshNode(c, q, det), 500);
    });
    list.addEventListener('click', async e => {
      const b = e.target.closest('.k-ai'); if (!b) return;
      const k = b.dataset.k; const idx = nodeIndexes.get(q.id); const det = b.closest('details');
      b.disabled = true; b.textContent = '考え中…';
      q.aiErr = q.aiErr || {}; delete q.aiErr[k];
      try {
        const res = await aiQuestions(c, q, chainFor(q, k, idx));
        q.ai[k] = res; saveCompany(c); toast('次の質問を追加しました');
      } catch (err) { q.aiErr[k] = aiErrorMessage(err); }
      refreshNode(c, q, det);
    });
    card.querySelector('.q-copy').onclick = async () => {
      const lines = [`【${c.name}】${q.title}`];
      const walk = (nodes, indent) => nodes.forEach(n => {
        lines.push(`${indent}・${n.q}`);
        const a = (q.notes[n.key] || '').trim(); if (a) lines.push(`${indent}  → ${a.replace(/\n/g, ' ')}`);
        walk(childNodes(c, q, n), indent + '　');
      });
      walk(topNodes(c, q), '');
      try { await navigator.clipboard.writeText(lines.join('\n')); toast('コピーしました'); } catch (err) { toast('コピーできませんでした'); }
    };
    const aiBtn = card.querySelector('.q-ai');
    aiBtn.onclick = async () => {
      if (!(q.answer || '').trim()) { toast('先に回答を書いてください'); return; }
      aiBtn.disabled = true; aiBtn.textContent = '考え中…';
      q.aiErr = q.aiErr || {}; delete q.aiErr.root;
      try { q.ai.root = await aiQuestions(c, q, []); saveCompany(c); toast('AIの深掘り質問を追加しました'); }
      catch (err) { q.aiErr.root = aiErrorMessage(err); }
      aiBtn.disabled = false; aiBtn.textContent = '✨ AIで深掘り';
      const open = openKeys(list); list.innerHTML = deepDiveList(c, q); restoreOpen(list, open);
    };
  });
}
function refreshNode(c, q, det) {
  if (!det.isConnected) return;
  const k = det.dataset.k; const idx = nodeIndexes.get(q.id); const node = idx && idx.get(k); if (!node) return;
  const wrap = det.querySelector(':scope > .body > .kids-wrap');
  const open = openKeys(wrap);
  wrap.innerHTML = kidsHtml(c, q, node, childNodes(c, q, node), idx);
  restoreOpen(wrap, open);
  const meta = det.querySelector(':scope > summary .meta');
  const n = childNodes(c, q, node).length, note = (q.notes[k] || '').trim();
  meta.innerHTML = `${note ? '<span class="done" aria-label="答えメモあり">✓</span>' : ''}${n ? `<span class="lv">↳${n}</span>` : ''}`;
}

/* ================= 企業ダイアログ ================= */
let editing = null;
function openCompanyDialog(c) {
  editing = c;
  $('#dlgCompanyTitle').textContent = c ? '企業情報を編集' : '企業を追加';
  $('#cName').value = c ? c.name : '';
  $('#cIndustry').value = c ? c.industry || '' : '';
  $('#cStatus').value = c ? c.status || 'ES作成中' : 'ES作成中';
  $('#cDeadline').value = c ? c.deadline || '' : '';
  $('#cUrl').value = c ? c.url || '' : '';
  $('#cMemo').value = c ? c.memo || '' : '';
  $('#btnDeleteCompany').hidden = !c;
  $('#dlgCompany').showModal();
}
$('#btnCompanyCancel').onclick = () => $('#dlgCompany').close();
$('#formCompany').addEventListener('submit', e => {
  e.preventDefault();
  const v = { name: $('#cName').value.trim(), industry: $('#cIndustry').value.trim(), status: $('#cStatus').value,
    deadline: $('#cDeadline').value, url: $('#cUrl').value.trim(), memo: $('#cMemo').value };
  if (!v.name) return;
  let c = editing;
  if (c) Object.assign(c, v);
  else {
    c = { id: uid(), ...v, questions: [
      { id: uid(), title: '志望動機を教えてください。', limit: '400', answer: '', notes: {}, ai: {} },
      { id: uid(), title: '学生時代に最も力を入れたことは何ですか。', limit: '400', answer: '', notes: {}, ai: {} },
    ] };
    state.companies.push(c); route = { view: 'company', id: c.id };
  }
  saveCompany(c, true); $('#dlgCompany').close(); render();
});
$('#btnDeleteCompany').onclick = async () => {
  const c = editing; if (!c) return;
  $('#dlgCompany').close();
  if (!await askConfirm(`「${c.name}」とすべての設問・メモを削除しますか？`, '削除')) return;
  await removeCompany(c); route = { view: 'home', id: null }; render(); toast('削除しました');
};

/* ================= 設定・バックアップ ================= */
function openSettings() {
  $('#aiStatus').textContent = caps.sample
    ? 'AIの深掘りは、あなたの Claude のプランの範囲で動きます（APIキーや追加料金は不要です）。'
    : 'AIの深掘りは、claude.ai でこのページを開いたときに使えます。ここではアプリ内の自動深掘りだけが動きます。';
  $('#storeStatus').textContent = caps.col
    ? 'データは claude.ai 上の、あなただけが読める保存場所に保存されています。'
    : 'データはこの端末のブラウザに保存されています。機種変更の前には書き出してください。';
  $('#dlgSettings').showModal();
}
$('#btnSettingsClose').onclick = () => $('#dlgSettings').close();
$('#btnExport').onclick = async () => {
  flushAll();
  const json = JSON.stringify(state, null, 2), filename = `es-backup-${new Date().toISOString().slice(0, 10)}.json`;
  if (caps.downloads) {
    try { await caps.downloads.save({ filename, data: json }); } catch (e) { toast('書き出しを中止しました'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#btnImport').onclick = () => $('#fileImport').click();
$('#fileImport').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let d;
  try { d = JSON.parse(await f.text()); if (!d || !Array.isArray(d.companies)) throw 0; }
  catch (err) { toast('読み込めないファイルです'); return; }
  $('#dlgSettings').close();
  if (!await askConfirm(`${d.companies.length}社のデータを読み込みます。同じ企業のデータは上書きされます。`, '読み込む')) return;
  d.companies.forEach(c => {
    if (!c || !c.id || !c.name) return;
    normalize(c);
    const i = state.companies.findIndex(x => x.id === c.id);
    if (i >= 0) state.companies[i] = c; else state.companies.push(c);
    saveCompany(c, true);
  });
  route = { view: 'home', id: null }; render(); toast('読み込みました');
};

/* ================= 面接練習（深掘りの連鎖つき） ================= */
let practice = null;
function startPractice(c) {
  const pool = [];
  c.questions.forEach(q => {
    const idx = new Map(); nodeIndexes.set(q.id, idx);
    topNodes(c, q).forEach(n => { idx.set(n.key, n); pool.push({ q, node: n }); });
  });
  if (!pool.length) return;
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  practice = { c, pool, i: 0, cur: pool[0] };
  showPractice(); $('#dlgPractice').showModal();
}
function showPractice() {
  const { c, cur } = practice, q = cur.q, node = cur.node;
  const idx = nodeIndexes.get(q.id);
  const chain = chainFor(q, node.key, idx).slice(0, -1);
  $('#pTitle').textContent = node.depth > 1 ? `面接練習 ・ 深掘り${node.depth}段目` : `面接練習 ${practice.i + 1} / ${practice.pool.length}`;
  $('#pFrom').textContent = `${c.name} ・ ${q.title || '設問'}`;
  $('#pChain').textContent = chain.length
    ? chain.map(x => `Q. ${x.q}\nA. ${x.a}`).join('\n')
    : (q.answer ? 'あなたのES：\n' + q.answer : '（この設問は未回答です）');
  $('#pQ').textContent = node.q;
  $('#pNote').value = q.notes[node.key] || '';
  updateDeeper();
}
function updateDeeper() {
  const { cur } = practice;
  const b = $('#pDeeper');
  b.disabled = !(cur.q.notes[cur.node.key] || '').trim() || cur.node.depth >= MAX_DEPTH;
  b.title = b.disabled ? '答えをメモすると、この答えへの深掘りに進めます' : '';
}
$('#pNote').oninput = e => {
  const { c, cur } = practice; cur.q.notes[cur.node.key] = e.target.value; saveCompany(c); updateDeeper();
};
$('#pDeeper').onclick = () => {
  const { c, cur } = practice; const idx = nodeIndexes.get(cur.q.id);
  const kids = childNodes(c, cur.q, cur.node); if (!kids.length) return;
  kids.forEach(k => idx.set(k.key, k));
  const next = kids.find(k => !(cur.q.notes[k.key] || '').trim()) || kids[0];
  practice.cur = { q: cur.q, node: next }; showPractice();
};
$('#pNext').onclick = () => { practice.i = (practice.i + 1) % practice.pool.length; practice.cur = practice.pool[practice.i]; showPractice(); };
$('#pClose').onclick = () => $('#dlgPractice').close();
$('#dlgPractice').addEventListener('close', () => { flushAll(); if (route.view === 'company') render(); });

render();
initStore();
</script>
